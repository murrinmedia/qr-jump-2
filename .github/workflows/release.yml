name: Build & Release

# Runs automatically when you push a v* tag (e.g. git tag v1.0.5 && git push origin v1.0.5).
# Creates a GitHub Release and attaches qr-jump.zip automatically.

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Create plugin zip
        run: |
          mkdir -p qr-jump
          rsync -r \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='/src' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/webpack.config.js' \
            --exclude='*.zip' \
            --exclude='.DS_Store' \
            --exclude='plugin-build' \
            --exclude='migrate-from-v1.sql' \
            --exclude='vendor/endroid/qr-code/assets/noto_sans.otf' \
            --exclude='vendor/endroid/qr-code/assets/blackfire.png' \
            --exclude='vendor/endroid/qr-code/README.md' \
            --exclude='vendor/bacon/bacon-qr-code/README.md' \
            --exclude='vendor/yahnis-elsts/plugin-update-checker/README.md' \
            . qr-jump/
          zip -r qr-jump.zip qr-jump/

      - name: Verify zip contents
        run: |
          # Guard against exclude rules stripping files the plugin needs at runtime.
          for f in \
            qr-jump/qr-jump.php \
            qr-jump/build/index.js \
            qr-jump/vendor/autoload.php \
            qr-jump/vendor/endroid/qr-code/src/Builder/Builder.php \
            qr-jump/vendor/bacon/bacon-qr-code/src/Writer.php \
            qr-jump/vendor/dasprid/enum/src/AbstractEnum.php; do
            unzip -l qr-jump.zip | grep -q " $f$" || { echo "Missing from zip: $f"; exit 1; }
          done
          echo "Zip contents verified."

      - name: Create release and attach zip
        uses: softprops/action-gh-release@v2
        with:
          files: qr-jump.zip
